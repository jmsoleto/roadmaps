<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Roadmaps</title>
    <!--
      Paint the stored theme before the first frame.

      This runs before the bundle has loaded and before the app has read the
      canonical preference, so without it every launch would flash the default
      theme. This mirror is written by `theme/apply.ts`; the key must match
      BOOT_KEY.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('roadmaps:theme:boot');
          if (!raw) return;
          var vars = JSON.parse(raw);
          var root = document.documentElement;
          for (var name in vars) {
            if (name.slice(0, 2) === '--') root.style.setProperty(name, vars[name]);
          }
          if (vars['--bg']) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', vars['--bg']);
          }
        } catch (e) {
          /* A bad mirror costs a flash, never a blank app. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
